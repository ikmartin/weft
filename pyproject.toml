[project]
name = "weft"
version = "0.1.0.dev0"
description = "A machine-readable library of mathematical results: crawl a citation network, extract statements and proofs, link them where the papers say so."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Isaac Martin" }]
dependencies = ["click>=8.1"]

[project.scripts]
weft = "weft.cli:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weft"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]  # prose is never hard-wrapped; ruff format governs code width

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "network: needs the real services (set WEFT_NETWORK=1)",
]
